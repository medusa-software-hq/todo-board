version: '3'

includes:
  frontend:
    taskfile: frontend/Taskfile.yml
    dir: frontend

tasks:
  checkFormatting:
    desc: Check formatting
    deps: [frontend:checkFormatting]

  fixFormatting:
    desc: Fix formatting
    deps: [frontend:fixFormatting]

  lint:
    desc: Lint the app sources
    deps: [frontend:lint]

  analyze:
    desc: Type check and build the frontend
    deps: [frontend:typecheck, frontend:build]

  build-image:
    desc: Build the web app's container image
    # The build context is the repository root: the contract the client is generated from lives
    # outside `web-app`.
    dir: ..
    cmds:
      - docker build -f web-app/Dockerfile .
