name: Deploy web app

# Staging, then production — see `deploy-api-service` for the same shape.
#
# Unlike the API, the web app is built once per environment rather than once in total: the bundle
# carries the OAuth client it signs people in with, and that client belongs to one environment. What
# is promoted here is the order, not the artifact.

on:
  push:
    branches: [main]
    paths:
      - "web-app/**"
      - "api/openapi/**"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-staging:
    name: Deploy staging
    uses: ./.github/workflows/deploy-web-app-env.yml
    with:
      environment: staging
    permissions:
      contents: read
      id-token: write

  deploy-prod:
    name: Deploy prod
    needs: deploy-staging
    uses: ./.github/workflows/deploy-web-app-env.yml
    with:
      environment: prod
    permissions:
      contents: read
      id-token: write
