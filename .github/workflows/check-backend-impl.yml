name: Check backend implementation

on:
  workflow_call:

permissions:
  contents: read

env:
  JAVA_VERSION: 21
  NO_COLOR: 1

jobs:
  check-gradle-root:
    name: Check Gradle root
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-java@v5.7.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v6.3.0

      - name: Run `ktfmtCheck` Gradle task
        run: ./gradlew ktfmtCheck

      - name: Run `detekt` Gradle task
        run: ./gradlew detekt

      - name: Run `test` Gradle task
        run: ./gradlew test
