name: Check Web app infra

on:
  workflow_call:

permissions:
  contents: read

env:
  TERRAFORM_VERSION: 1.15

  TF_INPUT: false
  TF_CLI_ARGS: -no-color
  NO_COLOR: 1

jobs:
  check-terraform:
    name: Check Terraform module
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ~> ${{ env.TERRAFORM_VERSION }}

      - uses: terraform-linters/setup-tflint@v6.3.0

      - name: Run `terraform fmt`
        working-directory: web-app/infra
        run: terraform fmt -check -recursive

      - name: Run `tflint`
        working-directory: web-app/infra
        run: tflint --recursive

      # No GCP auth and no plan here on purpose: the CI/CD identity and the project id are
      # environment-scoped, so a pull request cannot authenticate to plan. Validation catches
      # configuration errors; the plan and apply happen per environment on `main`.
      #
      # Once per environment, because validation resolves the workspace — checking only one would
      # say nothing about a value whose shape differs in the other.
      - name: Run `terraform validate`
        working-directory: web-app/infra
        run: |
          terraform init -backend=false
          for environment in prod staging; do
            TF_WORKSPACE="$environment" terraform validate
          done
