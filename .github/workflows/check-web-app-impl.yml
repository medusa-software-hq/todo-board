name: Check web app implementation

on:
  workflow_call:

permissions:
  contents: read

env:
  NO_COLOR: 1

jobs:
  check-frontend:
    name: Check frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: web-app/frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: web-app/frontend/.nvmrc

      - name: Install dependencies
        run: corepack yarn install --immutable

      - name: Generate the API client
        # The same contract the service is generated from. Anything downstream typechecks against
        # what the API actually promises, or fails here.
        run: |
          corepack yarn openapi-ts -i ../../api/openapi/todo-board.yaml -o src/gen
          node scripts/exempt-generated.mjs

      - name: Run `oxfmt`
        run: corepack yarn oxfmt --check "**/*.{ts,tsx,css}"

      - name: Run `oxlint`
        # `--type-aware` is where the rules that need the type checker live.
        run: corepack yarn oxlint --type-aware

      - name: Run `tsc`
        run: corepack yarn tsc --noEmit -p tsconfig.app.json

      - name: Build
        run: corepack yarn vite build
