# Latest version supporting Java 21
micronautVersion=4.10.17

# KSP and the Micronaut processors need more than the default heap: without this the Kotlin daemon
# dies mid-`kspKotlin`, and leaves a heap dump in the project root on its way out.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=1024m
