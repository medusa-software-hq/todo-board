version: '3'

includes:
  infra:
    taskfile: infra/Taskfile.yml
    dir: infra

  config:
    taskfile: config/Taskfile.yml
    dir: config

  github:
    taskfile: github.Taskfile.yml
    dir: .

  gradleRoot:
    taskfile: gradle.Taskfile.yml
    dir: .

  web-app:
    taskfile: web-app/Taskfile.yml
    dir: web-app

tasks:
  dev:
    desc: Run the whole app locally — the backend stack, and Vite pointed at it
    deps:
      - web-app:frontend:api
    cmds:
      - ./gradlew :web-app:dev-launcher:run --console=plain
    interactive: true

  desc: Apply all automatic fixes
  fixAll:
    deps:
      - config:fixFormatting
      - infra:fixFormatting
      - github:fixLint
      - gradleRoot:fixFormatting
      - web-app:fixFormatting
